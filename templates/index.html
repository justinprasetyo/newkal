<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewKal: A spaced repetition reminder app.</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <h1>NewKal v1</h1>

    <div>
        <h2 id="month-label"></h2>
        <button id="prev-month-btn"><</button>
        <button id="next-month-btn">></button>
    </div>
    
    <div class="calendar" id="calendar">
    </div>

    <div class="skills-list" id="skills-list">
        <button id="skills-list-close-btn">&times;</button>

        <table>
            <thead>
                <tr>
                    <th></th>
                </tr>
            </thead>

            <tbody id="skills-table">
                
            </tbody>
        </table>
    </div>

    <div class="stats" id="stats">
        <button id="stats-close-btn">&times;</button>

        <div class="skills-content">

            <h1 class="name-header" id="skill-name">Sliding Window Algo</h1>

            <div class="sub-headers-group">
                <h2 class="sub-header">Start-date:</h2>
                <p id="skill-start-date">09/28/2026</p>

                <h2 class="sub-header">Retention-rate:</h2>
                <p id="skill-retention-rate">49%</p>

                <h2 class="sub-header">Next interval:</h2>
                <p id="skill-next-interval">3 days</p>

                <h3 id="skill-level">Washed</h3>
                <button id="complete-skill-review">done?</button>
            </div>
                
        </div>

        <div class="bottom-header">
            <button id="delete-skill-review">Delete review</button>
        </div>
    </div>

    <div>
        <label for="daily-subject">What did you learn today? </label>
        <input id="daily-subject">
        <button id="daily-subject-btn">ok!</button>
    </div>

    <div class="finish-review-confirmation" id="finish-review-confirmation">
        <h4>how did it go?</h4>
        <p id="finish-review-confirmation-text"></p>
        <button class="finish-review-rating" value="0">forgot</button>
        <button class="finish-review-rating" value="25">eh</button>
        <button class="finish-review-rating" value="50">okay</button>
        <button class="finish-review-rating" value="75">well</button>
        <button class="finish-review-rating" value="100">perfect</button>
    </div>
    

    <button id="all-topics-btn">topics</button>
    <script src="/static/app.js" defer></script>
</body>
</html>
